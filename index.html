<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Morning Chweety</title>
    <style>
        :root {
            --primary-pink: #ff4d6d;
            --glass: rgba(255, 255, 255, 0.25);
        }

        body {
            margin: 0;
            background: #fff0f3;
            color: #333;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        /* Hero Image Section */
        .hero {
            height: 55vh;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('bg.png');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .glass-header {
            background: var(--glass);
            backdrop-filter: blur(12px);
            padding: 20px 30px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.3);
            animation: fadeInDown 1.5s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Video Player */
        .video-wrapper {
            margin: -40px auto 30px;
            width: 85%;
            max-width: 450px;
            border-radius: 25px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.3);
            border: 4px solid white;
            z-index: 10;
            position: relative;
        }

        video { width: 100%; display: block; }

        /* Modern Image Grid */
        .gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 20px 40px;
            max-width: 500px;
            margin: 0 auto;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 25px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .gallery img:active { transform: scale(0.9); }

        .footer-text {
            color: var(--primary-pink);
            font-weight: 600;
            padding-bottom: 50px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="glass-header">
            <h1 style="margin:0; font-size: 1.8rem;">Good Morning, Chweety! ❤️</h1>
        </div>
    </section>

    <div class="video-wrapper">
        <video controls autoplay muted loop playsinline>
            <source src="video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <div class="gallery">
        <img src="us1.png" alt="Memory One">
        <img src="us2.jpg" alt="Memory Two">
    </div>

    <div class="footer-text">
        Every moment with you is a treasure. ✨
    </div>

</body>
</html>
