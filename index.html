<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVE RUN — Eternally Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@1,300;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --gold:    #f0c060;
  --gold2:   #c8882a;
  --rose:    #e0365a;
  --rose2:   #8a1030;
  --deep:    #08040f;
  --ink:     #110820;
  --purple:  #2a1050;
  --cyan:    #40e0d0;
  --white:   #fdf8f0;
  --glow-gold: 0 0 20px #f0c06088, 0 0 60px #f0c06044;
  --glow-rose: 0 0 20px #e0365a88, 0 0 60px #e0365a44;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  width:100%;height:100%;
  background:var(--deep);
  overflow:hidden;
  font-family:'Rajdhani',sans-serif;
  color:var(--white);
  cursor:default;
}

/* ─── SCANLINE OVERLAY ─── */
body::after{
  content:'';
  position:fixed;inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,transparent 2px,
    rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px
  );
  pointer-events:none;z-index:9999;
}

/* ─── SCREENS ─── */
.screen{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transition:opacity .5s;
}
.screen.hidden{opacity:0;pointer-events:none;}

/* ══════════════════════════════
   LOADING SCREEN
══════════════════════════════ */
#s-load{background:var(--deep);z-index:100;}
.load-logo{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(1.4rem,3vw,2.4rem);
  color:var(--gold);
  letter-spacing:.2em;
  text-shadow:var(--glow-gold);
  animation:logoFlicker 2s infinite;
}
@keyframes logoFlicker{
  0%,100%{opacity:1}40%{opacity:.85}42%{opacity:.4}44%{opacity:.9}70%{opacity:1}
}
.load-bar-wrap{
  width:320px;height:4px;
  background:rgba(255,255,255,.08);
  border-radius:2px;margin-top:32px;
  overflow:hidden;border:1px solid rgba(240,192,96,.2);
}
.load-bar{
  height:100%;width:0;
  background:linear-gradient(90deg,var(--rose),var(--gold));
  border-radius:2px;
  box-shadow:0 0 12px var(--gold);
  transition:width .3s;
}
.load-sub{
  font-size:.8rem;letter-spacing:.3em;
  color:rgba(240,192,96,.5);margin-top:14px;
  text-transform:uppercase;
}

/* ══════════════════════════════
   START SCREEN
══════════════════════════════ */
#s-start{background:var(--deep);z-index:50;}

.bg-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(240,192,96,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(240,192,96,.04) 1px,transparent 1px);
  background-size:60px 60px;
  animation:gridScroll 20s linear infinite;
}
@keyframes gridScroll{to{background-position:0 60px;}}

.bg-radial{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 50% at 50% 50%,rgba(42,16,80,.9),var(--deep));
  pointer-events:none;
}

.studio-tag{
  font-size:.7rem;letter-spacing:.5em;
  color:rgba(240,192,96,.4);
  text-transform:uppercase;margin-bottom:24px;
  border:1px solid rgba(240,192,96,.15);
  padding:5px 18px;border-radius:2px;
  position:relative;z-index:2;
}

.game-title-wrap{position:relative;z-index:2;text-align:center;margin-bottom:8px;}
.game-title{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(2.8rem,7vw,6rem);
  font-weight:900;
  line-height:.9;
  background:linear-gradient(180deg,#fff8e0 0%,var(--gold) 40%,var(--gold2) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 0 30px rgba(240,192,96,.5));
  letter-spacing:.05em;
}
.game-subtitle{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:clamp(1rem,2.5vw,1.5rem);
  color:rgba(224,54,90,.9);
  letter-spacing:.2em;
  margin-top:8px;
  text-shadow:var(--glow-rose);
}

/* Character portraits on start */
.char-stage{
  display:flex;align-items:flex-end;gap:0;
  position:relative;z-index:2;
  margin:32px 0 28px;
}
.char-card{
  position:relative;
  width:140px;
  display:flex;flex-direction:column;align-items:center;
}
.char-card img{
  width:130px;height:130px;
  object-fit:cover;object-position:top;
  border-radius:50%;
  border:2px solid var(--gold);
  box-shadow:0 0 0 4px rgba(240,192,96,.12),var(--glow-gold);
  animation:charFloat 3s ease-in-out infinite;
}
.char-card:last-child img{animation-delay:1.5s;}
@keyframes charFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}
.char-name{
  font-size:.75rem;letter-spacing:.25em;
  color:rgba(240,192,96,.7);margin-top:10px;
  text-transform:uppercase;
}

.vs-heart{
  font-size:3rem;margin:0 12px 50px;
  color:var(--rose);
  animation:heartPulse 1s ease-in-out infinite;
  filter:drop-shadow(0 0 10px var(--rose));
  position:relative;z-index:2;
}
@keyframes heartPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}

/* Decorative divider */
.divider{
  display:flex;align-items:center;gap:12px;
  position:relative;z-index:2;margin-bottom:28px;
}
.divider-line{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.divider-gem{
  width:10px;height:10px;
  background:var(--gold);
  transform:rotate(45deg);
  box-shadow:var(--glow-gold);
}

.btn-play{
  position:relative;z-index:2;
  font-family:'Cinzel Decorative',serif;
  font-size:1rem;letter-spacing:.15em;
  color:var(--deep);
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  border:none;
  padding:16px 56px;
  border-radius:3px;
  cursor:pointer;
  box-shadow:0 0 30px rgba(240,192,96,.4),inset 0 1px 0 rgba(255,255,255,.3);
  transition:all .2s;
  text-transform:uppercase;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
}
.btn-play::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.25),transparent);
  clip-path:inherit;
}
.btn-play:hover{
  transform:translateY(-3px);
  box-shadow:0 0 50px rgba(240,192,96,.6),inset 0 1px 0 rgba(255,255,255,.3);
}
.btn-play:active{transform:translateY(0);}

.start-hint{
  position:relative;z-index:2;
  font-size:.72rem;letter-spacing:.3em;
  color:rgba(253,248,240,.25);
  margin-top:20px;text-transform:uppercase;
}

/* Corner decorations */
.corner{
  position:absolute;width:60px;height:60px;
  border-color:rgba(240,192,96,.3);border-style:solid;
  z-index:2;
}
.corner-tl{top:20px;left:20px;border-width:2px 0 0 2px;}
.corner-tr{top:20px;right:20px;border-width:2px 2px 0 0;}
.corner-bl{bottom:20px;left:20px;border-width:0 0 2px 2px;}
.corner-br{bottom:20px;right:20px;border-width:0 2px 2px 0;}

/* ══════════════════════════════
   GAME SCREEN
══════════════════════════════ */
#s-game{
  background:var(--deep);
  z-index:10;
  flex-direction:column;
  gap:0;
  justify-content:flex-start;
  padding:0;
}

/* TOP HUD BAR */
#hud{
  width:100%;
  max-width:900px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:10px 20px 6px;
  position:relative;z-index:20;
}
.hud-left,.hud-right{display:flex;flex-direction:column;gap:4px;}
.hud-right{align-items:flex-end;}

.hud-label{
  font-size:.6rem;letter-spacing:.35em;
  color:rgba(240,192,96,.45);text-transform:uppercase;
}
.hud-val{
  font-family:'Cinzel Decorative',serif;
  font-size:1.1rem;
  color:var(--gold);
  text-shadow:var(--glow-gold);
  line-height:1;
}
.hud-lives{color:var(--rose);font-size:1.4rem;line-height:1;}

.hud-center{
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.hud-timer-ring{
  position:relative;width:64px;height:64px;
}
.hud-timer-ring svg{transform:rotate(-90deg);}
.timer-bg{fill:none;stroke:rgba(240,192,96,.1);stroke-width:4;}
.timer-arc{
  fill:none;stroke:var(--gold);stroke-width:4;
  stroke-linecap:round;
  stroke-dasharray:163;
  stroke-dashoffset:0;
  filter:drop-shadow(0 0 4px var(--gold));
  transition:stroke-dashoffset .3s, stroke .5s;
}
.timer-num{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Rajdhani',sans-serif;font-weight:700;
  font-size:1rem;color:var(--gold);
}

/* Journey progress */
#journey-wrap{
  width:100%;max-width:900px;margin:0 auto 6px;
  padding:0 20px;position:relative;z-index:20;
}
.journey-track{
  position:relative;height:8px;
  background:rgba(255,255,255,.05);
  border-radius:4px;
  border:1px solid rgba(240,192,96,.12);
  overflow:visible;
}
.journey-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--rose),var(--gold));
  border-radius:4px;
  box-shadow:0 0 8px var(--gold);
  transition:width .3s;
  position:relative;
}
.journey-fill::after{
  content:'♥';
  position:absolute;right:-8px;top:50%;transform:translateY(-50%);
  font-size:.8rem;color:var(--gold);
  filter:drop-shadow(0 0 4px var(--gold));
}
.journey-icon-end{
  position:absolute;right:-4px;top:50%;transform:translateY(-50%);
  font-size:1.1rem;
}
.journey-labels{
  display:flex;justify-content:space-between;
  font-size:.6rem;letter-spacing:.25em;
  color:rgba(240,192,96,.3);
  margin-top:4px;text-transform:uppercase;
}

/* CANVAS */
#canvas-wrap{
  width:100%;max-width:900px;
  margin:0 auto;
  position:relative;flex:1;
  display:flex;align-items:center;
  padding:0 20px 10px;
}
#gameCanvas{
  width:100%;
  border-radius:8px;
  border:1px solid rgba(240,192,96,.15);
  box-shadow:0 0 40px rgba(240,192,96,.08),0 0 80px rgba(224,54,90,.06);
  display:block;
}

/* Obstacle label popup */
#obs-popup{
  position:absolute;
  top:20px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,rgba(224,54,90,.95),rgba(138,16,48,.95));
  border:1px solid rgba(240,192,96,.3);
  color:white;padding:7px 22px;border-radius:2px;
  font-size:.85rem;font-weight:600;letter-spacing:.08em;
  pointer-events:none;white-space:nowrap;
  clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);
  transition:opacity .3s;opacity:0;z-index:30;
  box-shadow:0 4px 20px rgba(224,54,90,.5);
}

/* COMBO popup */
#combo-popup{
  position:absolute;
  top:55px;left:50%;transform:translateX(-50%);
  font-family:'Cinzel Decorative',serif;
  font-size:1.3rem;
  color:var(--gold);
  text-shadow:var(--glow-gold);
  pointer-events:none;
  opacity:0;transition:opacity .3s;
  white-space:nowrap;z-index:30;
}

/* ══════════════════════════════
   END SCREEN
══════════════════════════════ */
#s-end{
  background:var(--deep);
  z-index:80;
  gap:0;
}
#confettiCanvas{position:absolute;inset:0;pointer-events:none;}

.end-content{
  position:relative;z-index:5;
  display:flex;flex-direction:column;align-items:center;
  gap:0;
}

.wedding-frame-outer{
  position:relative;
  width:min(560px,88vw);
  animation:frameReveal .9s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes frameReveal{
  from{transform:scale(.4) rotate(-3deg);opacity:0;}
  to{transform:scale(1) rotate(0);opacity:1;}
}

/* Ornamental corners on wedding frame */
.wedding-frame-outer::before,
.wedding-frame-outer::after{
  content:'✦';
  position:absolute;
  font-size:1.5rem;
  color:var(--gold);
  text-shadow:var(--glow-gold);
  z-index:10;
}
.wedding-frame-outer::before{top:-12px;left:-8px;}
.wedding-frame-outer::after{bottom:-12px;right:-8px;}

.wedding-frame-inner{
  border:3px solid var(--gold);
  border-radius:6px;
  box-shadow:0 0 0 1px rgba(240,192,96,.2),
             0 0 40px rgba(240,192,96,.3),
             0 0 100px rgba(240,192,96,.15),
             inset 0 0 30px rgba(240,192,96,.05);
  overflow:hidden;
}
.wedding-frame-inner img{width:100%;display:block;}

.end-ribbon{
  background:linear-gradient(135deg,var(--rose),var(--rose2));
  clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,16px 100%);
  padding:8px 48px;
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(.8rem,2vw,1rem);
  letter-spacing:.15em;
  color:var(--white);
  box-shadow:0 4px 20px rgba(224,54,90,.5);
  margin-top:-2px;
  animation:fadeUp .8s .7s both;
}

.end-title{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(1.4rem,3.5vw,2.4rem);
  background:linear-gradient(135deg,#fff8e0,var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  text-align:center;
  margin:16px 0 4px;
  animation:fadeUp .8s .9s both;
  filter:drop-shadow(0 0 20px rgba(240,192,96,.4));
}
.end-score-line{
  font-size:.9rem;letter-spacing:.3em;
  color:rgba(240,192,96,.6);
  margin-bottom:20px;
  animation:fadeUp .8s 1.1s both;
  text-transform:uppercase;
}
.end-score-num{
  color:var(--gold);font-size:1.2rem;font-weight:700;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

.btn-replay{
  font-family:'Cinzel Decorative',serif;
  font-size:.85rem;letter-spacing:.15em;
  color:var(--deep);
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  border:none;padding:13px 44px;
  border-radius:3px;cursor:pointer;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  box-shadow:0 0 30px rgba(240,192,96,.35);
  transition:all .2s;
  animation:fadeUp .8s 1.3s both;
  text-transform:uppercase;
}
.btn-replay:hover{transform:translateY(-3px);box-shadow:0 0 50px rgba(240,192,96,.55);}

/* corner deco on end */
.corner-end{position:absolute;width:70px;height:70px;border-color:rgba(240,192,96,.25);border-style:solid;}
.ce-tl{top:16px;left:16px;border-width:2px 0 0 2px;}
.ce-tr{top:16px;right:16px;border-width:2px 2px 0 0;}
.ce-bl{bottom:16px;left:16px;border-width:0 0 2px 2px;}
.ce-br{bottom:16px;right:16px;border-width:0 2px 2px 0;}
</style>
</head>
<body>

<!-- LOADING -->
<div class="screen" id="s-load">
  <div class="load-logo">♥ LOVE RUN ♥</div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-sub" id="load-sub">Initialising…</div>
</div>

<!-- START -->
<div class="screen hidden" id="s-start">
  <div class="bg-grid"></div>
  <div class="bg-radial"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="studio-tag">Eternally Together Studio • 2025</div>

  <div class="game-title-wrap">
    <div class="game-title">LOVE RUN</div>
    <div class="game-subtitle">Together Against All Odds</div>
  </div>

  <div class="char-stage">
    <div class="char-card">
      <img id="ui-girl" src="girl.png" alt="Girl">
      <div class="char-name">She</div>
    </div>
    <div class="vs-heart">♥</div>
    <div class="char-card">
      <img id="ui-boy" src="boy.png" alt="Boy">
      <div class="char-name">He</div>
    </div>
  </div>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-gem"></div>
    <div class="divider-line"></div>
  </div>

  <button class="btn-play" onclick="startGame()">▶ Begin Journey</button>
  <div class="start-hint">Watch them fight for love — sit back &amp; enjoy</div>
</div>

<!-- GAME -->
<div class="screen hidden" id="s-game">
  <div id="hud">
    <div class="hud-left">
      <div class="hud-label">Hearts</div>
      <div class="hud-lives" id="hud-lives">♥♥♥</div>
    </div>
    <div class="hud-center">
      <div class="hud-timer-ring">
        <svg viewBox="0 0 56 56" width="56" height="56">
          <circle class="timer-bg" cx="28" cy="28" r="26"/>
          <circle class="timer-arc" id="timer-arc" cx="28" cy="28" r="26"/>
        </svg>
        <div class="timer-num" id="timer-num">11</div>
      </div>
    </div>
    <div class="hud-right">
      <div class="hud-label">Score</div>
      <div class="hud-val" id="hud-score">000000</div>
    </div>
  </div>

  <div id="journey-wrap">
    <div class="journey-track">
      <div class="journey-fill" id="journey-fill"></div>
      <div class="journey-icon-end">💍</div>
    </div>
    <div class="journey-labels">
      <span>Start</span><span>Journey to Marriage</span><span>Wedding</span>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="gameCanvas"></canvas>
    <div id="obs-popup"></div>
    <div id="combo-popup"></div>
  </div>
</div>

<!-- END -->
<div class="screen hidden" id="s-end">
  <canvas id="confettiCanvas"></canvas>
  <div class="corner-end ce-tl"></div>
  <div class="corner-end ce-tr"></div>
  <div class="corner-end ce-bl"></div>
  <div class="corner-end ce-br"></div>

  <div class="end-content">
    <div class="wedding-frame-outer">
      <div class="wedding-frame-inner">
        <img src="wedding.jpg" alt="Wedding">
      </div>
    </div>
    <div class="end-ribbon">ಶುಭಮಸ್ತು — Subhamastu</div>
    <div class="end-title">They Made It! 🎊</div>
    <div class="end-score-line">Final Score: <span class="end-score-num" id="end-score">0</span></div>
    <button class="btn-replay" onclick="location.reload()">↺ Play Again</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  IMAGE LOADER
// ═══════════════════════════════════════════
const IMGS = { girl: new Image(), boy: new Image(), wedding: new Image() };
IMGS.girl.src   = 'girl.png';
IMGS.boy.src    = 'boy.png';
IMGS.wedding.src = 'wedding.jpg';

let loaded = 0;
const NEED = 2;
const msgs = ['Loading hearts…','Polishing halos…','Summoning love…','Almost there…'];
let msgIdx = 0;

function onLoad() {
  loaded++;
  const pct = Math.round(loaded/NEED*100);
  document.getElementById('load-bar').style.width = pct+'%';
  if (loaded >= NEED) {
    document.getElementById('load-sub').textContent = 'Ready ♥';
    setTimeout(() => {
      document.getElementById('s-load').classList.add('hidden');
      document.getElementById('s-start').classList.remove('hidden');
    }, 500);
  }
}
IMGS.girl.onload  = onLoad;
IMGS.boy.onload   = onLoad;
IMGS.girl.onerror = onLoad;
IMGS.boy.onerror  = onLoad;

// Animate load bar messages
setInterval(() => {
  if (loaded < NEED) {
    msgIdx = (msgIdx+1)%msgs.length;
    document.getElementById('load-sub').textContent = msgs[msgIdx];
  }
}, 700);

// ═══════════════════════════════════════════
//  CANVAS
// ═══════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const W = 860, H = 320;
canvas.width  = W;
canvas.height = H;

// ═══════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════
const GROUND   = H - 70;
const CW = 52, CH = 68;     // char width/height
const GAP = 20;             // gap between chars
const GRAVITY  = 0.72;
const JUMP_F   = -15;
const DURATION = 12000;     // ms to reach end

// ═══════════════════════════════════════════
//  OBSTACLE TEMPLATES
// ═══════════════════════════════════════════
const OBS_DEFS = [
  { type:'tall',  label:'😡 Angry Parents',      w:36, h:88,  color:'#8B0000', emoji:'😡', speed:1 },
  { type:'tall',  label:'🙅 Family Objection',    w:32, h:80,  color:'#6B2E8B', emoji:'🙅', speed:1 },

function obsY(def) {
  if (def.type==='tall')  return GROUND + CH - def.h;
  if (def.type==='low')   return GROUND + 44;
  return GROUND - 28 - def.h;
}

function initScenery() {
  stars = Array.from({length:70}, () => ({

    r: Math.random()*1.8+.4, spd: Math.random()*.4+.1,

  }));
  flowers = Array.from({length:12}, () => ({

// ═══════════════════════════════════════════
//  AI AUTO-DODGE  (runs each frame)
// ═══════════════════════════════════════════
function aiDodge(char) {
  const LOOK_AHEAD = 180; // px ahead to start reacting
  const REACT_DIST = 120; // px when to actually jump/slide

  // Find nearest obstacle ahead of chars
  let nearest = null, minDist = Infinity;
  for (const ob of G.obstacles) {
    const dist = ob.x - (char.x + CW);
    if (dist > -CW && dist < LOOK_AHEAD) {
      if (dist < minDist) { minDist = dist; nearest = ob; }
    }
  }

  if (!nearest || minDist > REACT_DIST) return;

  const ob = nearest;
  const onGround = char.y >= GROUND - 2;

  if (ob.type === 'tall') {
    // Must jump over tall obstacles
    if (onGround && char.vy >= 0) {
      char.vy = JUMP_F;
      char.sliding = false;
      spawnSpark(char.x + CW/2, char.y - 5, '#f0c060');
    }
  } else if (ob.type === 'low') {
    // Must slide under low obstacles
    if (onGround && !char.sliding) {
      char.sliding   = true;
      char.slideTimer = 50;
      spawnSpark(char.x + CW/2, char.y + CH/2, '#40e0d0');
    }
  } else if (ob.type === 'float') {
    // Float obstacles are mid-air — jump OVER or stay on ground
    // They appear at GROUND - 28 - h, so around y ~ 180-220
    // Characters at GROUND (250) pass under them. Jump would hit them.
    // So DON'T jump — just run under. But if a tall is also coming, prioritise tall.
    // Nothing needed — chars pass under naturally.
  }
}

// ═══════════════════════════════════════════
//  DRAWING
// ═══════════════════════════════════════════
function drawBg() {
  // Deep sky gradient
  const sky = ctx.createLinearGradient(0,0,0,GROUND);
  sky.addColorStop(0,'#060212');
  sky.addColorStop(.5,'#130830');
  sky.addColorStop(1,'#220a48');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,GROUND);
}

function drawStars() {
  G.frame; // just reference
  stars.forEach(s => {
    s.x -= s.spd * G.speed * .04;
    if (s.x < 0) s.x = W;
    s.twinkle += .04;
    const alpha = .4 + Math.sin(s.twinkle)*.3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,240,210,${alpha})`;
    ctx.fill();
  });
}

function drawClouds() {
  bgClouds.forEach(c => {
    c.x -= c.spd * G.speed * .15;
    if (c.x+c.w < 0) c.x = W+c.w;
    ctx.save();
    ctx.globalAlpha = .06;
    ctx.fillStyle = '#c0a0ff';
    for (let i=0;i<3;i++) {
      ctx.beginPath();
      ctx.arc(c.x + i*c.w*.35, c.y + [0,-10,5][i], c.w*.22, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  });
}

function drawLanterns() {
  const colors = ['#f0c060','#e0365a','#40e0d0','#c060f0'];
  for (let i=0;i<5;i++) {
    const x = ((i*180 + G.frame*(0.5+i*.12)) % (W+160)) - 80;
    const y = 20 + Math.sin(G.frame*.018+i*1.3)*12 + i*14;
    const clr = colors[i%4];
    ctx.save();
    // String
    ctx.strokeStyle = 'rgba(240,192,96,.2)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,y-18); ctx.stroke();
    // Glow
    ctx.globalAlpha = .1;
    ctx.fillStyle = clr;
    ctx.beginPath(); ctx.arc(x,y,30,0,Math.PI*2); ctx.fill();
    // Body
    ctx.globalAlpha = .5;
    ctx.fillStyle = clr;
    ctx.beginPath(); ctx.ellipse(x,y,11,15,0,0,Math.PI*2); ctx.fill();
    // Highlight
    ctx.globalAlpha = .7;
    ctx.fillStyle = '#fff8e0';
    ctx.beginPath(); ctx.ellipse(x-3,y-4,4,6,-.3,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawGround() {
  const g = ctx.createLinearGradient(0,GROUND,0,H);
  g.addColorStop(0,'#3a0860'); g.addColorStop(.4,'#200540'); g.addColorStop(1,'#0f0220');
  ctx.fillStyle = g; ctx.fillRect(0,GROUND,W,H-GROUND);

  // Glowing edge line
  ctx.save();
  const edgeGrad = ctx.createLinearGradient(0,0,W,0);
  edgeGrad.addColorStop(0,'transparent'); edgeGrad.addColorStop(.3,'rgba(240,192,96,.4)');
  edgeGrad.addColorStop(.7,'rgba(224,54,90,.4)'); edgeGrad.addColorStop(1,'transparent');
  ctx.strokeStyle = edgeGrad; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
  ctx.restore();

  // Rangoli dots
  for (let i=0;i<W;i+=28) {
    const ox = (i + G.frame*G.speed*.35) % W;
    const alpha = .15+Math.sin(G.frame*.08+i*.2)*.12;
    ctx.beginPath(); ctx.arc(ox, GROUND+9, 2, 0, Math.PI*2);
    ctx.fillStyle = `rgba(240,192,96,${alpha})`; ctx.fill();
  }

  // Flowers
  flowers.forEach(f => {
    f.x -= G.speed*.6; f.r += .015;
    if (f.x < -20) f.x = W+20;
    drawFlower(f.x, f.y, f.c, f.r);
  });
}

function drawFlower(x,y,clr,rot) {
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  ctx.globalAlpha = .65;
  for (let i=0;i<5;i++) {
    ctx.rotate(Math.PI*2/5);
    ctx.beginPath(); ctx.ellipse(7,0,4.5,2.5,0,0,Math.PI*2);
    ctx.fillStyle=clr; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0,0,3.5,0,Math.PI*2);
  ctx.fillStyle='#fffde0'; ctx.globalAlpha=1; ctx.fill();
  ctx.restore();
}

function drawCharacter(img, c, isGirl) {
  ctx.save();
  // Invincibility flash
  if (G.invincible > 0 && G.invincible % 7 < 3) ctx.globalAlpha = .3;

  const dw = CW;
  const dh = c.sliding ? CH*.52 : CH;
  const cy = c.sliding ? GROUND + CH - dh : c.y;
  const bounce = (c.y >= GROUND && !c.sliding) ? Math.sin(G.frame*.2)*2.5 : 0;

  // Glow aura
  ctx.save();
  ctx.globalAlpha = .2;
  const auraClr = isGirl ? '#e0365a' : '#4090ff';
  const auraGrad = ctx.createRadialGradient(c.x+dw/2, cy+dh/2, 0, c.x+dw/2, cy+dh/2, dw);
  auraGrad.addColorStop(0, auraClr); auraGrad.addColorStop(1, 'transparent');
  ctx.fillStyle=auraGrad;
  ctx.fillRect(c.x-10, cy-10, dw+20, dh+20);
  ctx.restore();

  // Draw image or fallback rect
  if (img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, c.x, cy - bounce, dw, dh);
  } else {
    ctx.fillStyle = isGirl ? '#d63a6e' : '#4a90d9';
    ctx.beginPath(); ctx.roundRect(c.x, cy-bounce, dw, dh, 8); ctx.fill();
    ctx.fillStyle='white'; ctx.font='28px serif'; ctx.textAlign='center';
    ctx.fillText(isGirl?'👩':'👨', c.x+dw/2, cy-bounce+dh*.6);
  }

  // Ground shadow
  ctx.globalAlpha = .2;
  ctx.beginPath();
  const sw = dw*(c.sliding?1.3:.9);
  ctx.ellipse(c.x+dw/2, GROUND+CH-3, sw/2, 5, 0, 0, Math.PI*2);
  ctx.fillStyle='#000'; ctx.fill();
  ctx.restore();
}

function drawObstacle(ob) {
  ctx.save();
  ctx.shadowColor = ob.color; ctx.shadowBlur = 22;

  // Body gradient
  const grad = ctx.createLinearGradient(ob.x,ob.y,ob.x+ob.w,ob.y+ob.h);
  grad.addColorStop(0, ob.color+'ff'); grad.addColorStop(1, ob.color+'99');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.roundRect(ob.x, ob.y, ob.w, ob.h, 7); ctx.fill();

  // Border
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1.5;
  ctx.stroke();

  // Warning stripe at bottom of tall obstacles
  if (ob.type==='tall') {
    ctx.fillStyle='rgba(255,200,0,.15)';
    ctx.fillRect(ob.x+1, ob.y+ob.h-12, ob.w-2, 11);
  }

  // Emoji
  const esz = Math.min(ob.w, ob.h)*.62;
  ctx.font = `${esz}px serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowBlur=0;
  ctx.fillText(ob.emoji, ob.x+ob.w/2, ob.y+ob.h/2);
  ctx.restore();
}

function drawVFX() {
  // Particles
  G.particles = G.particles.filter(p=>p.life>0);
  G.particles.forEach(p => {
    p.x+=p.vx; p.y+=p.vy; p.vy+=.25; p.life--;
    const a = Math.floor(p.life/45*255).toString(16).padStart(2,'0');
    ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2);
    ctx.fillStyle=p.color+a; ctx.fill();
  });

  // Sparks
  G.sparks = G.sparks.filter(s=>s.life>0);
  G.sparks.forEach(s => {
    s.x+=s.vx; s.y+=s.vy; s.life--;
    const a = Math.floor(s.life/20*255).toString(16).padStart(2,'0');
    ctx.beginPath();
    ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.vx*3,s.y-s.vy*3);
    ctx.strokeStyle=s.color+a; ctx.lineWidth=2; ctx.stroke();
  });

  // Hearts
  G.hearts = G.hearts.filter(h=>h.life>0);
  G.hearts.forEach(h => {
    h.x+=h.vx; h.y+=h.vy; h.life--;
    ctx.save(); ctx.globalAlpha=h.life/70;
    ctx.font=`${h.sz}px serif`; ctx.textAlign='center';
    ctx.fillText('♥',h.x,h.y); ctx.restore();
  });
}

function drawSpeedLines() {
  // Cinematic speed lines when fast
  if (G.speed < 6) return;
  ctx.save();
  const intensity = (G.speed - 6) / 4;
  ctx.globalAlpha = intensity * .07;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1;
  for (let i=0;i<8;i++) {
    const y = 20 + i*(GROUND/8);
    ctx.beginPath();
    ctx.moveTo(0,y); ctx.lineTo(W*.3,y);
    ctx.stroke();
  }
  ctx.restore();
}

// ═══════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════
function updateChar(c) {
  c.vy += GRAVITY; c.y += c.vy;
  if (c.y >= GROUND) { c.y = GROUND; c.vy = 0; }
  if (c.slideTimer > 0) c.slideTimer--;
  else c.sliding = false;
}

function hitTest(ob, char) {
  const cY = char.sliding ? GROUND+22 : char.y;
  const cH = char.sliding ? CH*.46 : CH;
  return (
    char.x+6 < ob.x+ob.w && char.x+CW-6 > ob.x &&
    cY       < ob.y+ob.h && cY+cH         > ob.y
  );
}

let girl, boy;

function update() {
  if (!G.running) return;
  G.frame++;
  const now     = Date.now();
  const elapsed = now - G.startTime;
  const prog    = Math.min(elapsed / DURATION, 1);

  // Speed ramp: 4 → 9
  G.speed = 4 + prog * 5;

  // ── AI DODGE ──
  aiDodge(girl);
  // Boy perfectly mirrors girl
  boy.y          = girl.y;
  boy.vy         = girl.vy;
  boy.sliding    = girl.sliding;
  boy.slideTimer = girl.slideTimer;

  updateChar(girl);
  updateChar(boy);

  // ── SPAWN OBSTACLES ──
  if (G.obsCooldown > 0) G.obsCooldown--;
  if (G.obsCooldown <= 0 && G.obstacles.length < 3) {
    const def = OBS_DEFS[Math.floor(Math.random()*OBS_DEFS.length)];
    G.obstacles.push({
      ...def,
      x: W + 20,
      y: obsY(def),
      spd: G.speed * def.speed
    });
    G.obsCooldown = Math.floor(100 - prog*45 + Math.random()*40);
  }

  // Move obstacles
  G.obstacles.forEach(ob => { ob.x -= G.speed * ob.speed; });

  // Collision check
  if (G.invincible > 0) G.invincible--;

  G.obstacles = G.obstacles.filter(ob => {
    // Off screen left = dodged!
    if (ob.x + ob.w < 0) {
      G.score += 15;
      G.dodgeCombo++;
      if (G.dodgeCombo > 0 && G.dodgeCombo % 3 === 0) {
        G.score += G.dodgeCombo * 5;
        showCombo(G.dodgeCombo);
      }
      spawnHeart(girl.x+CW/2, girl.y-20);
      return false;
    }
    // Hit!
    if (G.invincible === 0 && (hitTest(ob,girl) || hitTest(ob,boy))) {
      G.lives = Math.max(0, G.lives-1);
      G.invincible = 110;
      G.dodgeCombo = 0;
      showObsPopup(ob.label);
      spawnParticles(ob.x+ob.w/2, ob.y+ob.h/2, ob.color);
      document.getElementById('hud-lives').textContent =
        '♥'.repeat(G.lives) + '♡'.repeat(3-G.lives);
      return false;
    }
    return true;
  });

  // Score tick
  if (G.frame % 6 === 0) G.score++;

  // Ambient hearts
  if (G.frame % 52 === 0) spawnHeart(girl.x+CW/2+8, girl.y-15);
  if (G.frame % 78 === 0) spawnHeart(boy.x+CW/2-4, boy.y-12);

  // ── UPDATE DOM HUD ──
  const timeLeft = Math.max(0, (DURATION - elapsed)/1000);
  document.getElementById('timer-num').textContent = Math.ceil(timeLeft);
  // SVG arc: circumference = 2π×26 ≈ 163
  const dashOff = 163 * (1 - timeLeft/12);
  document.getElementById('timer-arc').style.strokeDashoffset = dashOff;
  // Colour warning
  if (timeLeft < 4) document.getElementById('timer-arc').style.stroke = '#e0365a';
  else if (timeLeft < 7) document.getElementById('timer-arc').style.stroke = '#f0a020';

  document.getElementById('hud-score').textContent = String(G.score).padStart(6,'0');
  document.getElementById('journey-fill').style.width = (prog*100)+'%';

  if (elapsed >= DURATION) {
    G.running = false;
    setTimeout(showEnd, 500);
  }
}

// ═══════════════════════════════════════════
//  DRAW FRAME
// ═══════════════════════════════════════════
function drawFrame() {
  ctx.clearRect(0,0,W,H);
  drawBg();
  drawClouds();
  drawLanterns();
  drawStars();
  drawGround();
  drawSpeedLines();
  G.obstacles.forEach(drawObstacle);
  drawCharacter(IMGS.girl, girl, true);
  drawCharacter(IMGS.boy,  boy,  false);
  drawVFX();
}

function loop() {
  update();
  drawFrame();
  animId = requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════
//  GAME START / END
// ═══════════════════════════════════════════
function startGame() {
  document.getElementById('s-start').classList.add('hidden');
  document.getElementById('s-game').classList.remove('hidden');
  initScenery();

  girl = makeChar(100);
  boy  = makeChar(100 + CW + GAP);
  G    = makeState();
  G.running   = true;
  G.startTime = Date.now();

  document.getElementById('hud-lives').textContent = '♥♥♥';
  document.getElementById('hud-score').textContent = '000000';
  document.getElementById('journey-fill').style.width = '0%';

  loop();
}

function showEnd() {
  cancelAnimationFrame(animId);
  document.getElementById('s-game').classList.add('hidden');
  document.getElementById('end-score').textContent = String(G.score).padStart(6,'0');
  document.getElementById('s-end').classList.remove('hidden');
  startConfetti();
}

// ═══════════════════════════════════════════
//  CONFETTI
// ═══════════════════════════════════════════
function startConfetti() {
  const cc = document.getElementById('confettiCanvas');
  cc.width  = window.innerWidth;
  cc.height = window.innerHeight;
  const cx = cc.getContext('2d');
  const shapes = ['rect','circle','star'];
  const pieces = Array.from({length:220}, () => ({
    x: Math.random()*cc.width, y: -30,
    vx: (Math.random()-.5)*4,
    vy: Math.random()*5+2,
    r: Math.random()*7+3,
    rot: Math.random()*Math.PI*2,
    rotV: (Math.random()-.5)*.18,
    shape: shapes[Math.floor(Math.random()*3)],
    color: ['#f0c060','#e0365a','#40e0d0','#ffffff','#ff88cc','#88ccff','#c060f0'][Math.floor(Math.random()*7)]
  }));

  (function cloop() {
    cx.clearRect(0,0,cc.width,cc.height);
    pieces.forEach(p => {
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.rotV;
      if (p.y > cc.height+20) { p.y=-20; p.x=Math.random()*cc.width; }
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=p.color;
      if (p.shape==='rect') cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*2);
      else if (p.shape==='circle') { cx.beginPath();cx.arc(0,0,p.r/2,0,Math.PI*2);cx.fill(); }
      else {
        // star
        cx.beginPath();
        for(let i=0;i<5;i++){
          cx.lineTo(Math.cos((i*4*Math.PI/5)-Math.PI/2)*p.r,Math.sin((i*4*Math.PI/5)-Math.PI/2)*p.r);
        }
        cx.closePath();cx.fill();
      }
      cx.restore();
    });
    requestAnimationFrame(cloop);
  })();
}
</script>
