<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Good Morning ✨</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      overflow:hidden;
      background:#050816;
      color:white;
      height:100vh;
      width:100%;
      position:relative;
    }

    /* Animated Background */

    .bg{
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at top left, rgba(255,180,100,0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255,100,180,0.18), transparent 30%),
        linear-gradient(135deg,#050816,#0b1227,#101935);
      z-index:-5;
      animation:bgMove 10s ease-in-out infinite alternate;
    }

    @keyframes bgMove{
      from{
        transform:scale(1);
      }
      to{
        transform:scale(1.08);
      }
    }

    /* Floating Blur Orbs */

    .orb{
      position:absolute;
      border-radius:50%;
      filter:blur(80px);
      opacity:.5;
      animation:float 10s infinite ease-in-out alternate;
    }

    .orb1{
      width:250px;
      height:250px;
      background:#ff7b7b;
      top:-60px;
      left:-60px;
    }

    .orb2{
      width:300px;
      height:300px;
      background:#7b9dff;
      bottom:-80px;
      right:-80px;
      animation-delay:2s;
    }

    .orb3{
      width:180px;
      height:180px;
      background:#ffd86f;
      top:45%;
      left:55%;
      animation-delay:4s;
    }

    @keyframes float{
      from{
        transform:translateY(0px) translateX(0px);
      }
      to{
        transform:translateY(-40px) translateX(30px);
      }
    }

    /* Particles */

    .particles span{
      position:absolute;
      display:block;
      width:4px;
      height:4px;
      border-radius:50%;
      background:white;
      opacity:.5;
      animation:particles 15s linear infinite;
    }

    @keyframes particles{
      0%{
        transform:translateY(100vh) scale(0);
        opacity:0;
      }
      50%{
        opacity:.8;
      }
      100%{
        transform:translateY(-10vh) scale(1.5);
        opacity:0;
      }
    }

    /* Main Card */

    .container{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      position:relative;
    }

    .glass-card{
      width:min(900px,95%);
      backdrop-filter:blur(20px);
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:32px;
      padding:50px;
      text-align:center;
      box-shadow:
        0 8px 32px rgba(0,0,0,0.4),
        inset 0 0 0 1px rgba(255,255,255,0.06);
      position:relative;
      overflow:hidden;
    }

    .shine{
      position:absolute;
      top:-150%;
      left:-50%;
      width:200%;
      height:300%;
      background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.1),
        transparent
      );
      transform:rotate(25deg);
      animation:shine 7s infinite;
    }

    @keyframes shine{
      0%{
        transform:translateX(-100%) rotate(25deg);
      }
      100%{
        transform:translateX(100%) rotate(25deg);
      }
    }

    .emoji{
      font-size:70px;
      animation:sunrise 3s ease-in-out infinite alternate;
      margin-bottom:15px;
    }

    @keyframes sunrise{
      from{
        transform:translateY(0px) rotate(-5deg);
      }
      to{
        transform:translateY(-10px) rotate(5deg);
      }
    }

    h1{
      font-size:clamp(2.7rem,6vw,5rem);
      font-weight:700;
      line-height:1.1;
      background:linear-gradient(to right,#fff,#ffe08a,#ff9ecf);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom:20px;
      letter-spacing:1px;
    }

    .subtitle{
      font-size:1.15rem;
      color:rgba(255,255,255,0.82);
      max-width:700px;
      margin:auto;
      line-height:1.9;
    }

    .time-box{
      margin-top:35px;
      display:inline-flex;
      flex-direction:column;
      gap:5px;
      padding:18px 35px;
      border-radius:20px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.12);
    }

    #time{
      font-size:2rem;
      font-weight:600;
    }

    #date{
      font-size:0.95rem;
      opacity:0.75;
    }

    .buttons{
      margin-top:40px;
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
    }

    .btn{
      padding:14px 28px;
      border:none;
      border-radius:16px;
      font-size:1rem;
      font-weight:600;
      cursor:pointer;
      transition:.4s ease;
      text-decoration:none;
      color:white;
      position:relative;
      overflow:hidden;
    }

    .btn-primary{
      background:linear-gradient(135deg,#ff8a00,#ff4d6d);
      box-shadow:0 10px 25px rgba(255,100,120,0.35);
    }

    .btn-secondary{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.12);
    }

    .btn:hover{
      transform:translateY(-4px) scale(1.03);
    }

    .quote{
      margin-top:35px;
      font-size:1rem;
      opacity:.85;
      font-style:italic;
      min-height:30px;
      transition:.4s ease;
    }

    /* Music Toggle */

    .music-btn{
      position:absolute;
      top:20px;
      right:20px;
      width:52px;
      height:52px;
      border-radius:50%;
      border:none;
      background:rgba(255,255,255,0.08);
      color:white;
      font-size:1.2rem;
      cursor:pointer;
      backdrop-filter:blur(10px);
      transition:.3s;
      border:1px solid rgba(255,255,255,0.12);
    }

    .music-btn:hover{
      transform:scale(1.1);
    }

    /* Responsive */

    @media(max-width:768px){

      .glass-card{
        padding:35px 25px;
      }

      .subtitle{
        font-size:1rem;
      }

      #time{
        font-size:1.6rem;
      }
    }
  </style>
</head>

<body>

  <div class="bg"></div>

  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="particles" id="particles"></div>

  <button class="music-btn" onclick="toggleMusic()">🎵</button>

  <div class="container">

    <div class="glass-card">

      <div class="shine"></div>

      <div class="emoji">🌅</div>

      <h1>Good Morning</h1>

      <p class="subtitle">
        Every sunrise brings a new beginning, a fresh hope,
        and another chance to create something beautiful today.
      </p>

      <div class="time-box">
        <div id="time">07:00 AM</div>
        <div id="date">Saturday, 16 May</div>
      </div>

      <div class="buttons">
        <button class="btn btn-primary" onclick="changeQuote()">
          Inspire Me ✨
        </button>

        <a href="https://github.com" class="btn btn-secondary">
          GitHub 🚀
        </a>
      </div>

      <div class="quote" id="quote">
        “Rise above the storm and you will find the sunshine.”
      </div>

    </div>

  </div>

  <!-- Optional Music -->
  <audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8a4019d7f.mp3?filename=beautiful-piano-ambient-110624.mp3" type="audio/mpeg">
  </audio>

  <script>

    // Live Clock

    function updateTime(){

      const now = new Date();

      let hours = now.getHours();
      let minutes = now.getMinutes();

      const ampm = hours >= 12 ? 'PM' : 'AM';

      hours = hours % 12;
      hours = hours ? hours : 12;

      minutes = minutes < 10 ? '0' + minutes : minutes;

      document.getElementById('time').innerHTML =
        `${hours}:${minutes} ${ampm}`;

      document.getElementById('date').innerHTML =
        now.toLocaleDateString('en-US',{
          weekday:'long',
          day:'numeric',
          month:'long'
        });
    }

    setInterval(updateTime,1000);
    updateTime();

    // Quotes

    const quotes = [

      "Wake up with determination. Sleep with satisfaction.",

      "Today is another opportunity to shine brighter.",

      "A beautiful day begins with a beautiful mindset.",

      "Dream big, start small, act now.",

      "The sun reminds us that we can rise again every day.",

      "Your future is created by what you do today.",

      "Every morning is a fresh page in your story."

    ];

    function changeQuote(){

      const quote =
        quotes[Math.floor(Math.random() * quotes.length)];

      document.getElementById('quote').style.opacity = 0;

      setTimeout(() => {

        document.getElementById('quote').innerHTML =
          `“${quote}”`;

        document.getElementById('quote').style.opacity = 1;

      },300);
    }

    // Particles

    const particles = document.getElementById('particles');

    for(let i=0;i<45;i++){

      const span = document.createElement('span');

      span.style.left = Math.random()*100 + 'vw';
      span.style.animationDuration =
        (Math.random()*10 + 8) + 's';

      span.style.animationDelay =
        Math.random()*5 + 's';

      span.style.width =
        span.style.height =
        Math.random()*4 + 2 + 'px';

      particles.appendChild(span);
    }

    // Music

    const music = document.getElementById('bgMusic');

    let isPlaying = false;

    function toggleMusic(){

      if(isPlaying){
        music.pause();
        isPlaying = false;
      }else{
        music.play();
        isPlaying = true;
      }
    }

  </script>

</body>
</html>
